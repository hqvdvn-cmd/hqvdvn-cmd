<svg xmlns="http://www.w3.org/2000/svg" width="760" height="64" viewBox="0 0 760 64" role="img" aria-label="divider">
<defs>
 <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#7a1414" stop-opacity="0"/><stop offset="1" stop-color="#b3201c"/></linearGradient>
 <linearGradient id="r" x1="1" x2="0"><stop offset="0" stop-color="#7a1414" stop-opacity="0"/><stop offset="1" stop-color="#b3201c"/></linearGradient>
 <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>
<style>
.p{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.ln{animation:ln 3.2s ease-in-out infinite}
@keyframes ln{0%,100%{opacity:.55}50%{opacity:1}}
.drop{animation:drop 3.2s cubic-bezier(.5,0,.9,.5) infinite}
@keyframes drop{0%,45%{transform:translateY(0) scale(.2);opacity:0}55%{transform:translateY(0) scale(1);opacity:1}90%{transform:translateY(16px) scale(1,1.3);opacity:.9}100%{transform:translateY(20px);opacity:0}}
</style>
<g class="ln"><rect x="0" y="31.0" width="350.0" height="2" fill="url(#l)"/><rect x="410.0" y="31.0" width="350.0" height="2" fill="url(#r)"/></g>
<g transform="translate(380.0,30.0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <path class="p" d="M0,-21 L0,15 Q0,23 -7,24 M0,-9 Q-6,-14 -11,-23 M0,-9 Q6,-14 11,-23 M-7,2 Q0,-2 7,4" stroke="#ff2a1f" stroke-width="6" filter="url(#g)"/>
 <path d="M0,-21 L0,15 Q0,23 -7,24 M0,-9 Q-6,-14 -11,-23 M0,-9 Q6,-14 11,-23 M-7,2 Q0,-2 7,4" stroke="#c71f1a" stroke-width="2.6"/>
 <g class="drop" style="transform-origin:-7px 25px"><path d="M-7,24 q-2.6,4 0,5.5 q2.6,-1.5 0,-5.5z" fill="#c71f1a" stroke="none"/></g>
</g>
</svg>